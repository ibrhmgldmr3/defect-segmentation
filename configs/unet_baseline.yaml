# Faz 2 baseline config (placeholder degerler - Faz 2'de ayarlanacak)
data:
  category: hazelnut
  raw_dir: data/raw
  processed_dir: data/processed
  image_size: 256

model:
  name: unet
  encoder: resnet34
  encoder_weights: imagenet

train:
  batch_size: 8
  epochs: 50
  lr: 0.0001
  loss: combo_bce_dice
  seed: 42

logging:
  wandb_project: defect-segmentation
  checkpoint_dir: outputs/checkpoints
  log_dir: outputs/logs
